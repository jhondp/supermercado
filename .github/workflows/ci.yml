name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      # Loads config/ (stores, basket, matches.yaml) and renders the empty-state site.
      - name: Build site from empty data
        run: uv run python -m supermercado --data "$RUNNER_TEMP/empty" build --out "$RUNNER_TEMP/dist"
